name: Monthly Data Refresh

on:
  schedule:
    # Runs at 00:00 UTC on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-data:
    name: Refresh Data & Open PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tastematch/package-lock.json

      - name: Install dependencies
        working-directory: tastematch
        run: npm ci

      - name: Run Data Refresh Pipeline
        run: |
          python scripts/sources/restore_locality.py
          python scripts/sources/build_shards.py
          python scripts/validate_datasets.py
          cd tastematch && npm run build

      - name: Create Pull Request with Refreshed Data
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): automated monthly dataset refresh"
          title: "Automated Monthly Data Refresh"
          body: |
            ### Automated Monthly Data Refresh
            This PR was automatically generated by the monthly scheduled GitHub Action.
            - Rebuilt data shards and canonical indices
            - Verified all constraints via `scripts/validate_datasets.py`
            - Built production assets cleanly
            
            **Review Checklist:**
            - [ ] Dataset validator passed with 0 errors
            - [ ] Shard sizes within 8 MB raw cap
            - [ ] Locality coverage maintained
          branch: data/monthly-refresh
          delete-branch: true
          base: main
