name: Validate Owner Claim and Open PR

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process-claim:
    if: github.event.label.name == 'owner-claim' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dump Issue Body to File
        id: dump-body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "$ISSUE_BODY" > /tmp/issue_body.md

      - name: Validate Claim & Stage JSON
        id: validate
        run: |
          python scripts/validate_owner_claim_issue.py /tmp/issue_body.md > /tmp/claim_result.json
          echo "Validation succeeded."

      - name: Create Pull Request for Human Review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat(community): verified owner claim for issue #${{ github.event.issue.number }}"
          title: "[Owner Claim Review]: ${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          body: |
            ### Automated Owner Claim Validation Passed ✅
            This PR was automatically generated by the TasteMatch Owner Verification action.
            
            **Issue Reference:** #${{ github.event.issue.number }}
            **Changes:** Staged new verified owner profile into `data/community/owners_ng.json` (and mirrored frontend bundles).
            
            > [!IMPORTANT]
            > **Human Review Required:** Verify proof of ownership link and identity before merging to `main`. OpenStreetMap data remains untouched.
          branch: "owner-claim/issue-${{ github.event.issue.number }}"
          base: main
          labels: "community-review,owner-claim"
          delete-branch: true

      - name: Post Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "✅ **Verification Passed:** Your submission has been validated and staged for admin review. The TasteMatch team will review your proof link and merge your listing within 72 hours. Thank you!"
