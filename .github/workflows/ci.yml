name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Test, Build & Validate Datasets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        continue-on-error: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tastematch/package-lock.json

      - name: Install dependencies
        working-directory: tastematch
        run: npm ci

      - name: TypeScript Typecheck (tsc -b)
        working-directory: tastematch
        run: npx tsc -b

      - name: Run Vitest Suite (193 tests)
        working-directory: tastematch
        run: npx vitest run

      - name: Build Web Application
        working-directory: tastematch
        run: npm run build

      - name: Validate Datasets & Architecture
        run: python scripts/validate_datasets.py
