<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0C0D10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find verified restaurants across Nigeria and worldwide with opening hours, cuisine tags, WhatsApp ordering, and offline support." />
    <title>TasteMatch — Real Restaurant Discovery in Nigeria & Worldwide</title>

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tastematch.pages.dev/" />
    <meta property="og:title" content="TasteMatch — Real Restaurant Discovery in Nigeria & Worldwide" />
    <meta property="og:description" content="Find verified restaurants across Nigeria and worldwide with opening hours, cuisine tags, WhatsApp ordering, and offline support." />
    <meta property="og:image" content="https://tastematch.pages.dev/og-default.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tastematch.pages.dev/" />
    <meta name="twitter:title" content="TasteMatch — Real Restaurant Discovery in Nigeria & Worldwide" />
    <meta name="twitter:description" content="Find verified restaurants across Nigeria and worldwide with opening hours, cuisine tags, WhatsApp ordering, and offline support." />
    <meta name="twitter:image" content="https://tastematch.pages.dev/og-default.png" />

    <!-- Google Fonts: Space Grotesk + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Privacy-friendly, cookie-less analytics (GoatCounter: zero cookies, zero personal data, zero fingerprinting) -->
    <script data-goatcounter="https://tastematch.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
